starting_balance = 10000.0
base_currency = "USDT"

[data]
parquet_path = "data/clean/okx/BTC-USDT-SWAP/BTC-USDT-SWAP_1H_2026.parquet"
exchange = "OKX"
inst_id = "BTC-USDT-SWAP"
bar = "1h"

[strategy]
name = "hourly-exit-filter"
bar_interval = "1h"

fast_period = 16
slow_period = 48

# BTC search result: require a wider spread than the ETH MA5/20 strategy.
spread_threshold = 0.008
atr_period = 14
atr_pct_min = 0.005

# Wait for the spread to cross 0.1% beyond zero before closing.
exit_threshold = -0.001
cooldown_bars = 48

sizing = "all-in"
trade_size = 0.001
leverage = 1.0
min_order_notional = 0.0

maker_fee = 0.0002
taker_fee = 0.0005
