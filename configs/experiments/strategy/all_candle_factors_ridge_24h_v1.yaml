experiment:
  name: all_candle_factors_ridge_24h_v1
  allow_dirty_git: true

data:
  start: "2023-01-01"
  end: "2026-01-01"
  timeframe: "1h"
  universe:
    mode: start_snapshot
    venue: OKX
    instrument_type: SWAP
    settle_currency: USDT
    contract_type: linear
    min_quote_volume_24h: 5000000
    min_listing_days: 90
    top_n_by_volume: 50

factors:
  - name: momentum
    alias: momentum_24h
    params: {lookback: 24}
  - name: ma_spread
    alias: ma_spread_8_24
    params: {fast_period: 8, slow_period: 24}
  - name: trend_slope
    alias: trend_slope_24h
    params: {period: 24, weight_r2: false}
  - name: breakout
    alias: breakout_24h
    params: {period: 24}
  - name: mean_reversion
    alias: mean_reversion_24h
    params: {period: 24}
  - name: historical_volatility
    alias: volatility_24h
    params: {period: 24, annualize: true}
  - name: atr
    alias: atr_14h
    params: {period: 14, normalized: true}
  - name: volatility_change
    alias: volatility_change_24_72h
    params: {short_period: 24, long_period: 72}
  - name: up_down_volatility_asymmetry
    alias: volatility_asymmetry_24h
    params: {period: 24}
  - name: volume_change
    alias: volume_change_24h
    params: {period: 24}
  - name: turnover
    alias: turnover_24h
    params: {period: 24}
  - name: amihud
    alias: amihud_24h
    params: {period: 24, log_transform: false}
  - name: volume_price_divergence
    alias: volume_price_divergence_24h
    params: {period: 24}

combination:
  method: machine_learning
  name: ridge_24h_score
  training_horizon: 24
  params:
    model: ridge
    model_params:
      alpha: 100.0
    min_train_observations: 5000
    min_train_periods: 720
    train_window_periods: 4320
    retrain_every: 168
    embargo_bars: 1
    label_lag_bars: 1
    min_present_factors: 13

label:
  price: next_open
  horizons: [4, 8, 24]

preprocess:
  winsorize:
    lower: 0.01
    upper: 0.99
  normalize: zscore

evaluation:
  quantiles: 2
  ic_method: spearman
  min_cross_section: 5
  primary_horizon: 24

portfolio:
  mode: long_short

cost:
  fee_bps: 5
  slippage_bps: 3
