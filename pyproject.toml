[project]
name = "trend-trader"
version = "0.1.0"
description = "A minimal NautilusTrader project for OKX futures candles, backtesting, paper trading, and live trading scaffolding."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ccxt>=4.4.0",
    "httpx>=0.27.0",
    "nautilus-trader>=1.200.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
nt-okx-download = "trend_trader.data.okx_candles:main"
nt-okx-chart = "trend_trader.visualization.candlestick_chart:main"
nt-okx-backtest = "trend_trader.backtest.run_backtest:main"
nt-okx-paper = "trend_trader.live.paper:main"
nt-okx-live = "trend_trader.live.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_trader"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
