[project]
name = "trend-trader"
version = "0.1.0"
description = "An extensible NautilusTrader project for multi-exchange market data, backtesting, paper trading, and live trading."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ccxt>=4.4.0",
    "httpx>=0.27.0",
    "nautilus-trader>=1.200.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "scikit-learn>=1.6.0",
    "websockets>=14.0,<17.0",
    "duckdb>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
trend-trader-download = "trend_trader.data.okx_candles:main"
trend-trader-funding-download = "trend_trader.data.okx_funding_rates:main"
trend-trader-funding-collector = "trend_trader.data.okx_funding_collector:main"
trend-trader-open-interest-collector = "trend_trader.data.okx_open_interest_collector:main"
trend-trader-long-short-ratio-collector = "trend_trader.data.okx_long_short_ratio_collector:main"
trend-trader-universe-update = "trend_trader.data.universe:main"
trend-trader-history-download = "trend_trader.data.history:main"
trend-trader-offline-sync = "trend_trader.data.offline.cli:main"
trend-trader-offline-notify = "trend_trader.data.offline.cli:notify_main"
trend-trader-binance-download = "trend_trader.data.binance_offline.cli:main"
trend-trader-experiment = "trend_trader.experiments.runner:main"
trend-trader-factor-experiment = "trend_trader.experiments.factor.runner:main"
trend-trader-strategy-experiment = "trend_trader.experiments.strategy.runner:main"
trend-trader-chart = "trend_trader.visualization.candlestick_chart:main"
trend-trader-backtest = "trend_trader.backtest.run_backtest:main"
trend-trader-paper = "trend_trader.live.paper:main"
trend-trader-live = "trend_trader.live.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_trader"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
